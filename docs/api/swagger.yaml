openapi: 3.0.3
info:
  title: RideShare API
  description: Enterprise ride-sharing platform API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Gateway (local)
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                phone: { type: string }
                role: { type: string, enum: [rider, driver, admin] }
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK (returns accessToken, refreshToken)
        '401':
          description: Unauthorized
  /auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New accessToken and refreshToken
        '401':
          description: Invalid or expired refresh token
  /users/profile:
    get:
      summary: Get my profile (auth required)
    patch:
      summary: Update my profile (auth required)
    delete:
      summary: Deactivate my profile (auth required)
  /users/profile/avatar:
    post:
      summary: 'Upload avatar image (multipart/form-data, field: avatar)'
  /drivers/register:
    post:
      summary: Register as driver (auth required)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseNumber: { type: string }
                vehicleInfo: { type: object }
      responses:
        '201':
          description: Driver profile created
  /drivers/me:
    get:
      summary: Get my driver profile (driver role required)
    patch:
      summary: Update my driver profile
  /drivers/me/availability:
    patch:
      summary: 'Set availability (isAvailable: boolean)'
  /drivers/documents/license:
    post:
      summary: 'Upload license document (multipart, field: license)'
  # Location service (Day 3)
  /location:
    put:
      summary: Update driver location (driver auth required)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
                heading: { type: number, minimum: 0, maximum: 360 }
                speed: { type: number, minimum: 0 }
                isAvailable: { type: boolean }
      responses:
        '200':
          description: Updated location
  /location/offline:
    post:
      summary: Set driver offline (driver auth required)
  /location/nearby:
    get:
      summary: 'Get nearby drivers (query: lat, lng, radiusKm?, limit?)'
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
        - name: radiusKm
          in: query
          schema: { type: number, default: 5 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
  /location/driver/{driverId}:
    get:
      summary: Get a driver's current location
  /location/eta:
    get:
      summary: 'Get ETA between two points (query: fromLat, fromLng, toLat, toLng, avgSpeedKmh?)'
      parameters:
        - name: fromLat
          in: query
          required: true
          schema: { type: number }
        - name: fromLng
          in: query
          required: true
          schema: { type: number }
        - name: toLat
          in: query
          required: true
          schema: { type: number }
        - name: toLng
          in: query
          required: true
          schema: { type: number }
  # Ride service (Day 4)
  /rides:
    post:
      summary: Request a ride (rider auth)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pickupLat, pickupLng, dropoffLat, dropoffLng]
              properties:
                pickupLat: { type: number }
                pickupLng: { type: number }
                dropoffLat: { type: number }
                dropoffLng: { type: number }
      responses:
        '201':
          description: Ride created (requested or matched)
    get:
      summary: 'Get my rides (query: asRider, asDriver, limit)'
  /rides/{id}:
    get:
      summary: Get ride by id (rider/driver/admin)
  /rides/{id}/cancel:
    post:
      summary: 'Cancel ride (body: reason?)'
  /rides/{id}/accept:
    post:
      summary: Driver accept ride
  /rides/{id}/reject:
    post:
      summary: 'Driver reject ride (body: reason?)'
  /rides/{id}/start:
    post:
      summary: Driver start ride
  /rides/{id}/complete:
    post:
      summary: 'Driver complete ride (body: distanceKm?, durationMin?)'
  # Payment service (Day 5)
  /payments/wallet:
    get:
      summary: 'Get my wallet (balance)'
    post:
      summary: '(use /payments/wallet/topup or /payments/wallet/withdraw)'
  /payments/wallet/topup:
    post:
      summary: 'Top up wallet (body: amountCents or amount, description?)'
  /payments/wallet/withdraw:
    post:
      summary: 'Withdraw from wallet (body: amountCents or amount, description?)'
  /payments/transactions:
    get:
      summary: 'Get my transaction history (query: limit?, offset?)'
  /payments/payments:
    get:
      summary: 'Get my payments list (query: limit?)'
  /payments/payments/{id}:
    get:
      summary: Get payment by id
  /payments/payments/{id}/invoice:
    get:
      summary: Get invoice for payment
  /payments/payments/{id}/refund:
    post:
      summary: 'Refund payment (body: amountCents? or amount?)'
  /payments/payments/intent:
    post:
      summary: 'Create Stripe payment intent (body: amountCents or amount, metadata?)'
